[package]
name = "aeros-kernel"
version = "0.1.0"
edition = "2021"
authors = ["flutter-os contributors"]
description = "AeroOS freestanding x86_64 kernel (Rust runtime + Flutter shell)"
license = "MIT"

[dependencies]
bootloader_api = "0.11"
x86_64 = "0.15"
spin = { version = "0.9", default-features = false, features = ["spin_mutex"] }
pic8259 = "0.10"
uart_16550 = "0.3"
lazy_static = { version = "1.4", features = ["spin_no_std"] }
linked_list_allocator = "0.10"
log = "0.4"

[features]
default = []
