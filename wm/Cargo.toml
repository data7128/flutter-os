[package]
name = "wm"
version = "0.1.0"
edition = "2021"
authors = ["flutter-os contributors"]
description = "User-mode software window manager for AeroOS (Ring3, no_std)"
license = "MIT"

[dependencies]
# No external crates — pure bare-metal user-mode code.

[features]
default = ["skeleton"]
# Skeleton mode: provides fallback values when syscalls return ENOSYS,
# allowing the WM to compile and be type-checked without a real Ring3 kernel.
skeleton = []
