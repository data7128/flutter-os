name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  kernel:
    name: Build Kernel
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview
          targets: x86_64-unknown-none

      - name: Build kernel
        run: cargo build -p aeros-kernel --target x86_64-unknown-none --verbose

  usermode:
    name: Check User-Mode Crates
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview
          targets: x86_64-unknown-none

      - name: Check window manager
        run: cargo check -p wm --release

      - name: Check flutter shell
        run: cargo check -p flutter_shell --release

      - name: Check flutter adapter
        run: cargo check -p flutter_adapter --release

      - name: Check sysutils
        run: cargo check -p sysutils --release

  os-image:
    name: Build OS Image
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview
          targets: x86_64-unknown-none

      - name: Build OS image
        run: cargo build -p aeros-os --verbose
